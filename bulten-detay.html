    <div id="mobileMenu" class="hidden lg:hidden px-4 pt-2 pb-4 flex flex-col gap-3">

    </div>

<main class="pt-10 pb-20">

    <div class="bulten-sutun">
        <a href="bulten.html" class="text-sm font-semibold text-blue-700 dark:text-blue-300 hover:underline">← Tüm bültenler</a>

        <div id="yukleniyor" class="mt-10 space-y-4">
            <div class="iskelet h-12 w-4/5"></div>
            <div class="iskelet h-6 w-3/5"></div>
            <div class="iskelet h-72 w-full mt-8"></div>
        </div>

        <div id="hata" class="hidden mt-10 bg-red-50 border border-red-200 text-red-700 rounded-xl px-5 py-4 text-sm"></div>
    </div>

    <article id="bulten-yazi" class="hidden">
        <header class="bulten-sutun mt-6">
            <p class="text-xs font-bold tracking-[0.2em] text-blue-700 dark:text-blue-300 uppercase mb-4">HSD Bülten</p>
            <h1 id="baslik" class="bulten-baslik"></h1>
            <p id="altBaslik" class="bulten-alt mt-4 hidden"></p>

            <div class="flex items-center gap-3 mt-8 py-5 border-y" style="border-color: var(--b-cizgi)">
                <div id="yazarAvatar" class="bulten-avatar"></div>
                <div class="flex-1 min-w-0">
                    <p id="yazarAdi" class="font-semibold text-gray-900 dark:text-gray-100 text-sm truncate"></p>
                    <p id="yaziMeta" class="text-xs text-gray-500 dark:text-gray-400 mt-0.5"></p>
                </div>
            </div>
        </header>

        <figure id="kapak" class="hidden bulten-genis mt-10"></figure>

        <div class="bulten-sutun mt-10">
            <div id="govde" class="bulten-govde"></div>

            <!-- Yazar kartı -->
            <div class="mt-14 pt-8 border-t flex items-center gap-4" style="border-color: var(--b-cizgi)">
                <div id="sonYazarAvatar" class="bulten-avatar" style="width:56px;height:56px;font-size:1.3rem"></div>
                <div>
                    <p class="text-xs text-gray-500 dark:text-gray-400 uppercase tracking-wider">Yazan</p>
                    <p id="sonYazarAdi" class="font-bold text-lg text-gray-900 dark:text-gray-100"></p>
                    <p class="text-sm text-gray-500 dark:text-gray-400">HSD Gelişim Bülteni</p>
                </div>
            </div>
        </div>
    </article>
</main>

<footer class="bg-[#04067c] text-white py-10">
    <div class="max-w-7xl mx-auto px-4 flex flex-col md:flex-row items-center justify-between gap-4">

        <div class="flex items-center gap-5">
            <a href="https://www.instagram.com/hsdgelisim/" target="_blank" rel="noopener" class="text-blue-200 hover:text-white transition text-sm">Instagram</a>
            <a href="https://www.linkedin.com/company/hsdigu/" target="_blank" rel="noopener" class="text-blue-200 hover:text-white transition text-sm">LinkedIn</a>
            <a href="mailto:hsd.iguu@gmail.com" class="text-blue-200 hover:text-white transition text-sm">E-posta</a>
        </div>
    </div>
</footer>

<script src="js/api.js"></script>
<script src="js/bulten.js"></script>
