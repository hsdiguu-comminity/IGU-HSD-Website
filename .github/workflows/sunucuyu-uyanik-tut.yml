# YEDEK GOREV — asil is UptimeRobot'ta.
#
# Backend Render'in ucretsiz planinda calisiyor ve 15 dakika istek gelmezse
# uykuya geciyor. Sunucuyu uyanik tutma isini UptimeRobot yapiyor: 5 dakikada
# bir istek atiyor (ucretsiz plan, hsd.iguu@gmail.com hesabi).
#
# Bu gorev yalnizca yedektir: UptimeRobot hesabi kapanir ya da izleme
# durdurulursa saatte bir istek atarak sunucunun tamamen unutulmasini onler.
# Tek basina yeterli DEGILDIR; olcum sonucu GitHub zamanlanmis isleri
# yogunlukta erteleyip atliyor (bir donemde ortalama 235 dakikada bir calisti).
#
# Notlar:
#  - Zamanlanmis isler yalnizca deponun varsayilan dalindan (main) calisir.
#  - Depo herkese acik oldugu icin Actions dakikasi ucretsizdir.
#  - Depoda 60 gun boyunca hic hareket olmazsa GitHub zamanlanmis isleri
#    devre disi birakir. O durumda Actions sekmesinden yeniden etkinlestirin.
name: Sunucuyu uyanik tut

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: sunucuyu-uyanik-tut
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Backend'i uyandir
        run: |
          # Uyanma uzun surebilir: 90 sn bekle, gerekirse birkac kez dene.
          curl --silent --show-error --fail \
               --max-time 90 --retry 3 --retry-delay 15 --retry-all-errors \
               --output /dev/null --write-out 'HTTP %{http_code} - %{time_total}s\n' \
               https://hsd-backend.onrender.com/
