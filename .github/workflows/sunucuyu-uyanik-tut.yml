# Backend Render'in ucretsiz planinda calisiyor ve 15 dakika istek gelmezse
# uykuya geciyor. Uyanmasi yarim dakikayi bulabildiginden, o aralikta siteye
# giren ziyaretci etkinlikleri ve fotograflari goremiyordu.
#
# NEDEN BOYLE YAZILDI
# Onceki surum "*/10 * * * *" ile 10 dakikada bir calisacak sekilde
# ayarlanmisti. Gercekte olcum sonucu: GitHub zamanlanmis isleri yogunlukta
# erteleyip atliyor ve is ortalama 235 dakikada bir calisti; aralarin HEPSI
# 15 dakikanin uzerindeydi, yani sunucu yine uyudu.
#
# Bu yuzden artik tek bir calisma uzun sure yasiyor ve icinden duzenli araliklarla
# istek atiyor. Zamanlama gecikse bile kapsama neredeyse kesintisiz oluyor.
#
# Notlar:
#  - Zamanlanmis isler yalnizca deponun varsayilan dalindan (main) calisir.
#  - Depo herkese acik oldugu icin Actions dakikasi ucretsizdir.
#  - Depoda 60 gun boyunca hic hareket olmazsa GitHub zamanlanmis isleri
#    devre disi birakir. O durumda Actions sekmesinden yeniden etkinlestirin.
#  - Site ayrica kendini toparlar: istekler ve gorseller otomatik yeniden
#    deneniyor (js/api.js).
name: Sunucuyu uyanik tut

on:
  schedule:
    # Saat basi denenir; calisma zaten uzun surdugu icin gecikmeler sorun olmaz.
    - cron: '0 * * * *'
  workflow_dispatch:

# Yeni calisma basladiginda eskisi durur: ayni anda tek bir dongu yeter.
concurrency:
  group: sunucuyu-uyanik-tut
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    # GitHub'in is basina ust siniri 6 saat; biraz altinda kaliyoruz.
    timeout-minutes: 350
    steps:
      - name: Backend'i uyanik tut
        run: |
          # 5 dakikada bir istek: Render'in 15 dakikalik uyku esiginin altinda.
          BITIS=$(( $(date +%s) + 340 * 60 ))
          SAYAC=0

          while [ "$(date +%s)" -lt "$BITIS" ]; do
            SAYAC=$((SAYAC + 1))

            # Uyanma uzun surebilir: 90 sn bekle, gerekirse birkac kez dene.
            # Tek bir basarisiz istek isi dusurmez; bir sonraki tur yeniden dener.
            SONUC=$(curl --silent --show-error \
                         --max-time 90 --retry 2 --retry-delay 10 --retry-all-errors \
                         --output /dev/null \
                         --write-out 'HTTP %{http_code} - %{time_total}s' \
                         https://hsd-backend.onrender.com/ 2>&1) || true

            echo "$(date -u '+%H:%M:%S') UTC  #$SAYAC  $SONUC"
            sleep 300
          done
